<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hub</title>
  
   
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-dim: #94a3b8;
      --accent-1: #6366f1;
      --accent-2: #a855f7;
      --accent-3: #3b82f6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Background Orbs */
    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      opacity: 0.5;
      animation: float 10s ease-in-out infinite alternate;
    }

    .glow-1 {
      width: 350px;
      height: 350px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      top: 15%;
      left: 20%;
    }

    .glow-2 {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, var(--accent-3), #06b6d4);
      bottom: 15%;
      right: 20%;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -30px) scale(1.1); }
    }

    /* Glassmorphism Container */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 40px 28px;
      margin: 20px 0;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .header-icon {
      font-size: 32px;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      display: inline-block;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 32px;
    }
    
    .logo-text {
      font-size: 50pt;
      font-weight: 800;
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    .tex {
      color: #80acff;
    }

    .a {
      color: #00e5ff;
      text-shadow: 0 0 15px #00e5ff;
    }

    /* Buttons Hub Grid Layout (2x2 Grid) */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .btn-icon {
      font-size: 28px;
      color: #a855f7;
      transition: transform 0.3s ease;
    }

    /* Button Hover Effects */
    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(168, 85, 247, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -6px rgba(168, 85, 247, 0.25);
    }

    .btn:hover .btn-icon {
      transform: scale(1.18);
    }

    /* Active Tap Effect for Mobile */
    .btn:active {
      transform: translateY(0) scale(0.96);
    }

    /* Full-Width Feedback Button Styling */
    .feedback-container {
      margin-top: 16px;
    }

    .btn-feedback {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--text);
      text-decoration: none;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-feedback .feedback-icon {
      font-size: 20px;
      color: #38bdf8;
      transition: transform 0.3s ease;
    }

    .btn-feedback:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.25);
    }

    .btn-feedback:hover .feedback-icon {
      transform: scale(1.2) rotate(-5deg);
    }

    .btn-feedback:active {
      transform: translateY(0) scale(0.98);
    }
  </style>
</head>
<body>

   
  <div class="glow-1"></div>
  <div class="glow-2"></div>

   
  <div class="container">
    <div class="header-icon">
      <img src="1785091505295.png" width="120" height="100" alt="AI Icon">
    </div>
    
    <p class="logo-text">
      <span class="tex">Tex</span><span class="a">A</span>
    </p>

    <p class="subtitle">Select a module to launch</p>

     
    <div class="btn-group">
      <a class="btn" href="index1.html">
        <i class="fa-solid fa-microscope btn-icon"></i>
        <span>Fabric Scanner</span>
      </a>

      <a class="btn" href="index2.html">
        <i class="fa-solid fa-vr-cardboard btn-icon" style="color: #3b82f6;"></i>
        <span>Simulator</span>
      </a>

      <a class="btn" href="index3.html">
        <i class="fa-solid fa-wand-magic-sparkles btn-icon" style="color: #b8b800;"></i>
        <span>Suggestor</span>
      </a>

       
      <a class="btn" href="index4.html">
        <i class="fa-solid fa-shirt btn-icon" style="color: #10b981;"></i>
        <span>Dress Quality</span>
      </a>
    </div>

     
    <div class="feedback-container">
      <a class="btn-feedback" href="feedback.html">
        <i class="fa-solid fa-comment-dots feedback-icon"></i>
        <span>Give Feedback</span>
      </a>
    </div>
  </div>

</body>

 
</html>
